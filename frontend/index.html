<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEX Terminal</title>
  </head>
  <body>
    <div id="app">
      <section id="login-view">
        <div class="login-card">
          <h1>GEX QUANT TERMINAL</h1>
          <p class="subtitle">Sistema de autenticación institucional</p>
          <form id="login-form">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="submit">INGRESAR AL TERMINAL</button>
            <p id="login-error" class="error" hidden></p>
          </form>
        </div>
      </section>

      <section id="dashboard-view" hidden>
        <header>
          <div class="header-left">
            <h1>GEX QUANT TERMINAL</h1>
            <span id="user-badge"></span>
          </div>
          <div class="header-right">
            <span id="ws-status" class="status-pill status-connecting">conectando…</span>
            <button id="logout-btn">Cerrar sesión</button>
          </div>
        </header>

        <div class="metrics-bar">
          <div class="metric"><span class="metric-label">Symbol</span><span id="metric-symbol" class="metric-value">QQQ</span></div>
          <div class="metric"><span class="metric-label">Spot</span><span id="metric-spot" class="metric-value">--</span></div>
          <div class="metric"><span class="metric-label">Net GEX</span><span id="metric-net-gex" class="metric-value">--</span></div>
          <div class="metric"><span class="metric-label">Call Wall</span><span id="metric-cw1" class="metric-value">--</span></div>
          <div class="metric"><span class="metric-label">Put Wall</span><span id="metric-pw1" class="metric-value">--</span></div>
          <div class="metric"><span class="metric-label">Zero Gamma</span><span id="metric-zg" class="metric-value">--</span></div>
        </div>

        <div id="gex-info-chart" class="chart-container"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
