# Generado a mano para Fase 0 (no vía `fly launch`). Antes del primer
# deploy: `fly apps create <nombre-unico>` y reemplazar `app` abajo,
# `fly volumes create schwab_token_data --size 1` en la misma región, y
# `fly secrets set ...` con las claves listadas en .env.example.
app = "gex-terminal-api"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"

[[mounts]]
  source = "schwab_token_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # CRÍTICO (ver plan, sección Riesgos): la app corre tasks de fondo
  # (snapshot_writer cada 60s, quantower_pusher cada 8s) que deben seguir
  # empujando datos a Supabase/Firebase aunque nadie tenga el dashboard
  # abierto. El default de Fly duerme la máquina tras inactividad — eso
  # rompería esos jobs. Validar con una prueba de 1h en Fase 0.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
