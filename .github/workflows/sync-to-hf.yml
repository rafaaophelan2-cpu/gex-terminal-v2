name: Sync backend to Hugging Face Space

# Dispara un rebuild del Docker Space en Hugging Face cada vez que cambia
# algo dentro de backend/ en main. El Space NO se edita directamente — este
# workflow es la única fuente de verdad; cualquier cambio hecho a mano en
# el git de HF se pierde en el próximo push a main.
#
# Requiere un secret de repo llamado HF_TOKEN (Hugging Face -> Settings ->
# Access Tokens -> New token, rol "write") y las variables de repo
# HF_USERNAME y HF_SPACE_NAME (Settings -> Secrets and variables -> Actions
# -> Variables) con el usuario y el nombre exactos del Space creado.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/sync-to-hf.yml"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend/ como raíz del Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # El Space espera Dockerfile/README.md/app/requirements.txt en la
          # RAÍZ de su propio repo, mientras que en este monorepo viven bajo
          # backend/. git subtree split arma esa vista sin tocar la historia
          # del monorepo.
          git subtree split --prefix=backend -b hf-space-branch

          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" \
            hf-space-branch:main
